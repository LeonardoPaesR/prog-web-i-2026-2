<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 300" width="90" height="170">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8"/>
      <stop offset="35%" stop-color="#E5C158"/>
      <stop offset="70%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#6B4B00"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A4A4A"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
  </defs>
  <!-- Base do Troféu -->
  <rect x="35" y="270" width="90" height="22" rx="4" fill="url(#baseGrad)"/>
  <rect x="45" y="252" width="70" height="18" rx="2" fill="url(#baseGrad)"/>
  <rect x="52" y="240" width="56" height="12" rx="2" fill="url(#goldGrad)"/>
  <!-- Cabeça -->
  <ellipse cx="80" cy="40" rx="14" ry="17" fill="url(#goldGrad)"/>
  <!-- Pescoço e Torso -->
  <path d="M74,57 L86,57 L92,105 L88,155 L72,155 L68,105 Z" fill="url(#goldGrad)"/>
  <!-- Ombros e Braços segurando a Espada -->
  <path d="M68,62 C52,70 48,110 74,125 L76,115 C58,105 60,78 72,70 Z" fill="url(#goldGrad)"/>
  <path d="M92,62 C108,70 112,110 86,125 L84,115 C102,105 100,78 88,70 Z" fill="url(#goldGrad)"/>
  <!-- Espada Cruzada -->
  <line x1="80" y1="65" x2="80" y2="190" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="72" y1="85" x2="88" y2="85" stroke="#FFFFFF" stroke-width="3"/>
  <!-- Pernas e Apoio Inferior -->
  <rect x="68" y="155" width="10" height="85" rx="3" fill="url(#goldGrad)"/>
  <rect x="82" y="155" width="10" height="85" rx="3" fill="url(#goldGrad)"/>
</svg>
